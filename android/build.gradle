buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RnSdk_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.9.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnSdk_" + name]).toInteger()
}

android {
  namespace "br.com.certiface.rn.sdk"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  google()
  maven {
    url 'https://raw.githubusercontent.com/oititec/android-certiface-sdk-versions-beta/main'
  }
  maven {
    url 'https://cdn-fortface-sdk.fortface.com.br'
    content {
      includeGroup 'br.com.fortface'
    }
    credentials(HttpHeaderCredentials) {
      name = 'X-Sdk'
      value = 'certiface'
    }
    authentication {
      header(HttpHeaderAuthentication)
    }
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  implementation 'br.com.certiface:certifacesdk:2.0.3-beta'
}

react {
  jsRootDir = file("../src/")
  libraryName = "RnSdk"
  codegenJavaPackageName = "br.com.certiface.rn.sdk"
}
