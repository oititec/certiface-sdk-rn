name: Release Beta

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from
        type: string
        default: hom

jobs:
  release-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Get beta version
        id: version
        run: echo "VERSION=$(node -p "require('./package.beta.json').version")" >> $GITHUB_OUTPUT

      - name: Create and push beta tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="beta-v${{ steps.version.outputs.VERSION }}"
          git tag -a "$TAG" -m "Beta release $TAG" || true
          git push origin "$TAG" || true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish beta to npm
        run: node scripts/publish-beta.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
