name: Deploy Hom (Google Play + TestFlight)

on:
  push:
    branches:
      - hom

jobs:
  deploy-android:
    # Temporariamente desabilitado enquanto fechamos o iOS.
    if: false
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and key.properties
        working-directory: example/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties
          sed -i 's|storeFile=.*|storeFile=release.keystore|' key.properties || true

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null" || true

      - name: Build AAB
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace @oiti/rn-sdk-example run build:android:release:aab

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.oititec.rn.sdk.example
          releaseFiles: example/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          inAppUpdatePriority: '0'

  deploy-ios:
    runs-on: macos-14
    env:
      XCODE_VERSION: '16.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Import code signing certificate manually
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$HOME/Library/Keychains/login.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo '--- Keychains ---'
          security list-keychain -d user
          echo '--- Default keychain ---'
          security default-keychain -d user
          echo '--- Code signing identities ---'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo '--- Apple Distribution identities ---'
          security find-certificate -a -c "Apple Distribution" "$KEYCHAIN_PATH" || true
          echo '--- Identity check (expect >= 1 valid identity) ---'
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E '[1-9][0-9]* valid identities found|Apple Distribution' || true

      - name: Install provisioning profile from secret
        run: |
          PROFILE_PATH="$RUNNER_TEMP/certiface-sdk-rn-appstore.mobileprovision"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "${{ secrets.APPLE_MOBILE_PROFILE_CERTIFICATE_BASE64 }}" | base64 --decode > "$PROFILE_PATH"
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")

          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Profile team: $PROFILE_TEAM"
          echo "Profile app id: $PROFILE_APP_ID"
          echo '--- Installed provisioning profiles ---'
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Create ExportOptions.plist
        run: |
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}"
          mkdir -p example/ios
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>signingStyle</key>\n  <string>manual</string>\n  <key>teamID</key>\n  <string>%s</string>\n  <key>provisioningProfiles</key>\n  <dict>\n    <key>br.com.oititec.rncertifacesdk.example</key>\n    <string>%s</string>\n  </dict>\n</dict>\n</plist>\n' "$TEAM_ID" "$IOS_PROFILE_NAME" > example/ios/ExportOptions.plist

      - name: Show iOS signing build settings
        run: |
          cd example/ios
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}"
          xcodebuild -workspace RnSdkExample.xcworkspace \
            -scheme RnSdkExample \
            -configuration Release \
            -showBuildSettings \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" | grep -E 'PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN|PROVISIONING_PROFILE|OTHER_CODE_SIGN_FLAGS'

      - name: Build and archive iOS
        run: |
          cd example/ios
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}"
          xcodebuild -workspace RnSdkExample.xcworkspace \
            -scheme RnSdkExample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RnSdkExample.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
            archive

      - name: Export IPA
        run: |
          cd example/ios
          xcodebuild -exportArchive \
            -archivePath build/RnSdkExample.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist \
            OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: example/ios/build/RnSdkExample.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
