name: Deploy Hom (Google Play + TestFlight)

on:
  push:
    branches:
      - hom

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and key.properties
        working-directory: example/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties
          sed -i 's|storeFile=.*|storeFile=release.keystore|' key.properties || true

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null" || true

      - name: Build AAB
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace @certiface/sdk-example run build:android:release:aab

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.oititec.rn.sdk.example
          releaseFiles: example/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          inAppUpdatePriority: '0'

  deploy-ios:
    runs-on: macos-14
    env:
      XCODE_VERSION: '16.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Import Apple Distribution certificate
        id: import_certs
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Unlock signing keychain for xcodebuild
        run: |
          KC="signing_temp.keychain"
          LOGIN="login.keychain"
          security list-keychains -d user -s "$KC" "$LOGIN"
          security default-keychain -s "$KC"
          security unlock-keychain -p "${{ steps.import_certs.outputs.keychain-password }}" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security find-identity -v -p codesigning

      - name: Install provisioning profile (App Store)
        env:
          APPLE_MOBILE_PROFILE_CERTIFICATE_BASE64: ${{ secrets.APPLE_MOBILE_PROFILE_CERTIFICATE_BASE64 }}
        run: ./scripts/install-ios-provisioning-and-keychain.sh

      - name: Build iOS, export IPA and upload TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: ./scripts/test-pipeline-ios-local.sh --upload-testflight
