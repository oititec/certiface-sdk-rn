name: Deploy Hom (Google Play + TestFlight)

on:
  push:
    branches:
      - hom

jobs:
  deploy-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and key.properties
        working-directory: example/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties
          sed -i 's|storeFile=.*|storeFile=release.keystore|' key.properties || true

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null" || true

      - name: Build AAB
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace @oiti/rn-sdk-example run build:android:release:aab

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.oititec.rn.sdk.example
          releaseFiles: example/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
          inAppUpdatePriority: '0'

  deploy-ios:
    runs-on: macos-14
    env:
      XCODE_VERSION: '16.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install CocoaPods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}

      - name: Download provisioning profiles
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: br.com.oititec.rncertifacesdk.example
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Create ExportOptions.plist
        run: |
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}"
          mkdir -p example/ios
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>method</key>\n  <string>app-store</string>\n  <key>teamID</key>\n  <string>%s</string>\n</dict>\n</plist>\n' "$TEAM_ID" > example/ios/ExportOptions.plist

      - name: Build and archive iOS
        run: |
          cd example/ios
          TEAM_ID="${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}"
          xcodebuild -workspace RnSdkExample.xcworkspace \
            -scheme RnSdkExample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RnSdkExample.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Export IPA
        run: |
          cd example/ios
          xcodebuild -exportArchive \
            -archivePath build/RnSdkExample.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: example/ios/build/RnSdkExample.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
