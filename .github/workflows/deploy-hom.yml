name: Deploy Hom (Google Play + TestFlight)

on:
  workflow_dispatch:
    inputs:
      android_track:
        description: Faixa do Google Play
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal
      android_status:
        description: Status da release Android (completed publica no teste interno)
        type: choice
        options:
          - completed
          - draft
        default: completed

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.resolve.outputs.version_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      version_label: ${{ steps.resolve.outputs.version_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restore build counter
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: example/.deploy-build-state.json
          key: deploy-build-${{ hashFiles('example/package.json') }}

      - name: Resolve deploy version
        id: resolve
        run: node scripts/resolve-deploy-version.mjs --github-output

      - name: Show version
        run: cat example/deploy-version.env

  deploy-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply deploy version
        env:
          VERSION_NAME: ${{ needs.resolve-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.resolve-version.outputs.version_code }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
          VERSION_LABEL: ${{ needs.resolve-version.outputs.version_label }}
        run: node scripts/write-deploy-version-artifacts.mjs

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode keystore and key.properties
        working-directory: example/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties
          sed -i 's|storeFile=.*|storeFile=release.keystore|' key.properties || true

      - name: Cache Gradle
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null" || true

      - name: Build AAB
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: yarn workspace @certiface/sdk-example run build:android:release:aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.oititec.rn.sdk.example
          releaseFiles: example/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.android_track }}
          status: ${{ inputs.android_status }}
          inAppUpdatePriority: '0'

  deploy-ios:
    needs: resolve-version
    runs-on: macos-14
    env:
      XCODE_VERSION: '16.2'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Apply deploy version
        env:
          VERSION_NAME: ${{ needs.resolve-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.resolve-version.outputs.version_code }}
          BUILD_NUMBER: ${{ needs.resolve-version.outputs.build_number }}
          VERSION_LABEL: ${{ needs.resolve-version.outputs.version_label }}
        run: node scripts/write-deploy-version-artifacts.mjs

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache CocoaPods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            example/ios/Pods
            example/vendor/bundle
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('example/ios/Podfile.lock', 'example/Gemfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Use Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Configure iOS code signing
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATES_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATES_P12_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: ./scripts/import-ios-distribution-cert-ci.sh

      - name: Unlock signing keychain for xcodebuild
        if: steps.signing.outputs.signing-mode == 'p12'
        run: |
          security unlock-keychain -p "${{ steps.signing.outputs.keychain-password }}" "${{ steps.signing.outputs.keychain-name }}"
          security find-identity -v -p codesigning

      - name: Install provisioning profile (App Store)
        env:
          APPLE_MOBILE_PROFILE_CERTIFICATE_BASE64: ${{ secrets.APPLE_MOBILE_PROFILE_CERTIFICATE_BASE64 }}
        run: ./scripts/install-ios-provisioning-and-keychain.sh

      - name: Sync iOS version
        run: ./scripts/sync-ios-version.sh

      - name: Build iOS and export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'KRCZ6X7U8S' }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: ./scripts/test-pipeline-ios-local.sh

      - name: Resolve IPA path
        id: ipa
        run: |
          IPA="example/ios/build/RnSdkExample.ipa"
          if [[ ! -f "$IPA" ]]; then
            IPA=$(find example/ios/build -name '*.ipa' -type f 2>/dev/null | head -1)
          fi
          if [[ -z "$IPA" || ! -f "$IPA" ]]; then
            echo "Nenhum .ipa em example/ios/build"
            exit 1
          fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5.2.1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          backend: appstore-api
