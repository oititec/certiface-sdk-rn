def reactNativeNodeModulesDirForApp = file("${rootDir}/../../node_modules/react-native")
if (!reactNativeNodeModulesDirForApp.exists()) {
    reactNativeNodeModulesDirForApp = file("${rootDir}/../../../node_modules/react-native")
}
if (reactNativeNodeModulesDirForApp.exists()) {
    ext.REACT_NATIVE_NODE_MODULES_DIR = reactNativeNodeModulesDirForApp.absolutePath
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.appdistribution"
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    nodeExecutableAndArgs = [rootProject.ext.REACT_NATIVE_NODE_EXECUTABLE]

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def getPackageJson() {
    def packageJsonFile = file("../../package.json")
    return new groovy.json.JsonSlurper().parseText(packageJsonFile.text)
}

def getDeployVersion() {
    def jsonFile = file("../../deploy-version.json")
    if (jsonFile.exists()) {
        return new groovy.json.JsonSlurper().parse(jsonFile)
    }
    def propsFile = file("../../deploy-version.env")
    if (!propsFile.exists()) {
        return null
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return [
        versionCode: props.VERSION_CODE as Integer,
        versionLabel: props.VERSION_LABEL,
    ]
}

def getSemverBase(String version) {
    def parts = (version ?: "1.0.0").tokenize(".")
    def major = parts.size() > 0 ? (parts[0] as Integer) : 0
    def minor = parts.size() > 1 ? (parts[1] as Integer) : 0
    def patch = parts.size() > 2 ? (parts[2] as Integer) : 0
    return major * 1000000 + minor * 1000 + patch * 10
}

def getVersionCode() {
    def deployVersion = getDeployVersion()
    if (deployVersion?.versionCode != null) {
        return deployVersion.versionCode as Integer
    }
    def packageJson = getPackageJson()
    def version = packageJson.version ?: "1.0.0"
    def code = packageJson.versionCode
    if (code != null) {
        return code as Integer
    }
    return getSemverBase(version) + 1
}

def getVersionName() {
    def deployVersion = getDeployVersion()
    if (deployVersion?.versionLabel) {
        return deployVersion.versionLabel as String
    }
    def packageJson = getPackageJson()
    def version = packageJson.version ?: "1.0.0"
    def code = getVersionCode()
    def buildNumber = code - getSemverBase(version)
    return "${version} (${buildNumber > 0 ? buildNumber : 1})"
}

def VERSION_CODE = getVersionCode()
def VERSION_NAME = getVersionName()

def getReleaseNotes() {
    def packageJson = getPackageJson()
    def versionName = packageJson.version
    def versionCode = packageJson.versionCode
    return "Version ${versionName} (${versionCode})"
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "br.com.oititec.rn.sdk.example"
    defaultConfig {
        applicationId "br.com.oititec.rn.sdk.example"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode VERSION_CODE
        versionName VERSION_NAME
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def releaseKeyProps = file("key.properties")
            if (releaseKeyProps.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(releaseKeyProps))
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            } else {
                def requestedTasks = gradle.startParameter.taskNames*.toLowerCase()
                def requiresReleaseSigning = requestedTasks.any { taskName ->
                    taskName.contains("release") ||
                    taskName.contains("bundle") ||
                    taskName.contains("publish") ||
                    taskName.contains("distribute")
                }
                if (requiresReleaseSigning) {
                    throw new GradleException(
                        "Assinatura de release obrigatória para AAB/Play Store. " +
                        "Copie key.properties.example para key.properties em android/app/, " +
                        "preencha com sua keystore de release e coloque o arquivo release.keystore em android/app/."
                    )
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            firebaseAppDistribution {
                artifactType = "APK"
                releaseNotes = getReleaseNotes() + " - Debug"
                groups = "testers"
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            firebaseAppDistribution {
                artifactType = "APK"
                releaseNotes = getReleaseNotes()
                groups = "testers"
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
