pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

apply from: file("rn-node-executable.gradle")
def nodeExecutableForAutolink = resolveReactNativeNodeExecutable()
def cliJsForAutolink = new File(settings.rootDir.parentFile, "node_modules/@react-native-community/cli/build/bin.js")
def autolinkCommand = cliJsForAutolink.isFile()
        ? [nodeExecutableForAutolink, cliJsForAutolink.absolutePath, "config"]
        : null

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (autolinkCommand != null) {
        ex.autolinkLibrariesFromCommand(autolinkCommand, settings.rootDir.parentFile)
    } else {
        ex.autolinkLibrariesFromCommand()
    }
}
rootProject.name = 'br.com.oititec.rn.sdk.example'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
