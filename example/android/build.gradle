apply from: file("rn-node-executable.gradle")

ext.REACT_NATIVE_NODE_EXECUTABLE = resolveReactNativeNodeExecutable()

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.10"
        agp_version = '8.9.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:${agp_version}")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:firebase-appdistribution-gradle:5.0.0")
    }
}

def reactNativeNodeModulesDirPath = null
def rnFromExample = file("${rootDir}/../node_modules/react-native")
if (rnFromExample.exists()) {
    reactNativeNodeModulesDirPath = rnFromExample.absolutePath
} else {
    def rnFromRepoRoot = file("${rootDir}/../../node_modules/react-native")
    if (rnFromRepoRoot.exists()) {
        reactNativeNodeModulesDirPath = rnFromRepoRoot.absolutePath
    }
}
if (reactNativeNodeModulesDirPath != null) {
    ext.REACT_NATIVE_NODE_MODULES_DIR = reactNativeNodeModulesDirPath
}

allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven {
            url 'https://raw.githubusercontent.com/oititec/android-certiface-sdk-versions/main'
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
